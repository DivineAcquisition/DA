# PostgREST in front of the local verification database.
#
# No jwt-secret on purpose: there is no auth server here, so every request is
# anonymous and the machine doors authenticate themselves against their own
# secret, which is the only thing http.sh exercises.
db-uri = "postgres://authenticator:authpass@localhost:5433/vistrial_verify"
db-schemas = "public"
db-anon-role = "anon"
server-port = 3002
server-host = "127.0.0.1"
db-pool = 4
